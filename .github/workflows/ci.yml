name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Build & Test
    runs-on: ubuntu-latest
    # Test-only placeholders: no external service is contacted by unit tests.
    env:
      SUPABASE_URL: https://ci.example.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      GEMINI_API_KEY: ci-placeholder-gemini-key
      AUTH_SECURITY_SECRET: ci-placeholder-auth-security-secret-32-chars
      SMTP_USER: ci@example.invalid
      SMTP_PASS: ci-placeholder-password
      SMTP_FROM: CI <ci@example.invalid>
      ACCESS_REQUEST_NOTIFY_EMAIL: ci@example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build (TypeScript)
        run: npm run build
        working-directory: backend

      - name: Run unit tests
        run: npm test
        working-directory: backend

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build (TypeScript + Vite)
        run: npm run build
        working-directory: frontend
        env:
          VITE_AGENT_API_URL: https://api.example.com
